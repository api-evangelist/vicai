    ### Payment Status Updated


    This event is emitted when a payment you were previously notified about reaches

    a terminal outcome. For now it is sent only for negative outcomes (`failed`,

    `returned` and `voided`) and may be extended to other statuses later, so read

    `data.status` rather than assuming the outcome. Use it to keep your own system

    in sync without polling. Credits have their own

    [`credit_status_updated`](#credit-status-updated) event.


    * `data` is the payment itself, in the same shape the `getPaymentBatch`
      operation returns, flattened directly onto `data` (plus `batchId`).
    * `data.status` is the outcome that fired (`failed`, `returned` or `voided`). It
      overrides the payment's own status, so a returned payment reads `returned`
      here even though its underlying status may be `funded`.

    ```json

    {
      "id": "a7dae8d0-8baa-7a3d-885f-a7fc14835718",
      "occurred_at": "2025-04-04T14:34:55.123Z",
      "event": "payment_status_updated",
      "data": {
        "status": "failed",
        "batchId": "f1c2384f-57d8-41fe-afa6-17caf62b2a3f",
        "id": "edb3a624-9f12-4cd8-adb8-4d9a5ec0b48b",
        "amount": "200.00",
        "currencyId": "USD",
        "failedAt": "2023-10-02T08:00:00Z",
        "failedReason": "insufficient_funds",
        "invoice": {
          "internalId": "876",
          "externalId": "invoice-id-in-erp",
          "refNumber": "INV-123456"
        },
        "vendor": {
          "internalId": "409",
          "externalId": "vendor-id-in-erp"
        }
      }
    }

    ```


    ### Credit Status Updated


    This event mirrors [`payment_status_updated`](#payment-status-updated) for

    credits. It is emitted when a credit you were previously notified about reaches

    a terminal outcome (currently `failed`, `returned` or `voided`).


    * `data` is the credit itself, in the same shape the `getPaymentBatch`
      operation returns, flattened directly onto `data` (plus `batchId`).
    * `data.status` is the outcome that fired (`failed`, `returned` or `voided`),
      overriding the credit's own status.

    ```json

    {
      "id": "b1e9c7d2-4a3f-7b1e-995a-c2fd25946832",
      "occurred_at": "2025-04-04T14:34:55.123Z",
      "event": "credit_status_updated",
      "data": {
        "status": "voided",
        "batchId": "f1c2384f-57d8-41fe-afa6-17caf62b2a3f",
        "id": "091f257a-9b6e-4797-bcb6-ccd36dda260f",
        "amount": "20.00",
        "currencyId": "USD",
        "voidedAt": "2023-10-02T08:00:00Z",
        "invoice": {
          "internalId": "900",
          "externalId": "credit-note-id-in-erp",
          "refNumber": "CRN-123456"
        },
        "vendor": {
          "internalId": "409",
          "externalId": "vendor-id-in-erp"
        }
      }
    }

    ```


