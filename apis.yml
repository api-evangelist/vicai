aid: vicai
name: Vic.ai
description: 'Vic.ai builds AI-native software for enterprise Accounts Payable and finance teams, automating
  the end-to-end AP workflow: invoice capture from email/SFTP/API/mobile, AI extraction of header and
  line-level data, GL coding, purchase-order matching, approval routing, bill pay and vendor portals,
  corporate-card expense management, and analytics. It integrates with major ERPs (SAP, Oracle, Microsoft
  Dynamics, NetSuite, Workday, Coupa). The public Vic.ai API (docs.vic.ai) is an ERP-integration surface
  with 173 operations across invoices, purchase orders, payments, masterdata sync, and webhooks, authenticated
  with client-credentials Bearer JWTs. Vic.ai holds SOC 1/SOC 2 Type II and operates on an ISO 27001 framework.
  Backed by Cowboy Ventures, GGV Capital, and ICONIQ Capital.'
