- aid: vicai:vicai-webhook-subscriptions-api
  name: Vic.ai Webhook Subscriptions API
  description: >-
    Webhook subscriptions control which events your system receives and where

    they are delivered. Each company may have one V0 subscription or multiple

    V2 subscriptions.


    You can subscribe to all events or a specific subset. If you need to update

    your subscription to receive all events after trimming it down, pass

    `"events":["all"]` -- when using `all`, it must be set by itself.


    ## Partner Onboarding Flow


    Integration partners can programmatically provision new companies and

    configure webhook delivery using the V2 API:


    1. **Create a company** — `POST /v2/companies` with the company's name,
       country code, and billing timezone. The new company is automatically
       linked to your OAuth client, inheriting the organization of your
       primary company (or specify `organization_id` explicitly).

    2. **Create webhook subscriptions** — `POST /v2/companies/{company_id}/subscriptions`
       with your callback URL and the events you want to receive.

    3. **Manage subscriptions** — use `GET`, `PUT`, or `DELETE` on
       `/v2/companies/{company_id}/subscriptions/{id}` as needed.
