    ### Invoice Rejected


    This event is emitted from the Vic system when an invoice has been rejected

    during the approval process. The payload for this event matches almost exactly

    what you will receive in the `getInvoice` operation.


    The structure is identical to `invoice_approved` — refer to that event for the

    full payload example.


    ### Invoice Restored


    This event is emitted from the Vic system when a previously deleted invoice has

    been restored. It is the counterpart to `invoice_deleted`: subscribing to both

    lets you distinguish an invoice that was deleted, restored, and deleted again

    from a genuinely duplicated delete. The payload for this event is sparse — it

    contains only the `internalId` and `externalId` of the invoice.


    ```json

    {
      "id": "b8ebf9e1-9cbb-8b4e-996f-b8fd25946829",
      "occurred_at": "2025-04-04T14:34:55.123Z",
      "event": "invoice_restored",
      "data": {
        "internalId": "123",
        "externalId": "I0001"
      }
    }

    ```


    ### Invoice Submitted


    This event is emitted from the Vic system when an invoice has been submitted

    for processing. The payload for this event matches almost exactly what you will

    receive in the `getInvoice` operation.


    The structure is identical to `invoice_approved` — refer to that event for the

    full payload example.


