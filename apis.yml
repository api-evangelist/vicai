- aid: vicai:vicai-attachments-api
  name: Vic.ai Attachments API
  description: "Attachments are original invoice documents that can be processed by Vic.ai.\n\n## Supported\
    \ content types\n\n- `application/msword`\n- `application/pdf`\n- `application/vnd.ms-word.document.macroEnabled.12`\n\
    - `application/vnd.ms-word.template.macroEnabled.12`\n- `application/vnd.openxmlformats-officedocument.wordprocessingml.document`\n\
    - `application/vnd.openxmlformats-officedocument.wordprocessingml.template`\n- `image/tiff`\n- `text/xml`\
    \ **(See note below about supported EDI formats)**\n- `image/jpg`\n- `image/jpeg`\n- `image/png`\n\
    - `image/gif`\n- `application/vnd.ms-excel`\n- `application/vnd.ms-excel.addin.macroenabled.12`\n\
    - `application/vnd.ms-excel.sheet.binary.macroenabled.12`\n- `application/vnd.ms-excel.sheet.macroenabled.12`\n\
    - `application/vnd.ms-excel.template.macroenabled.12`\n- `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`\n\
    - `application/vnd.openxmlformats-officedocument.spreadsheetml.template`\n\n### Supported EDI formats:\n\
    \n#### PEPPOL BIS Billing v3 \n\nSupported embedded attachment MIME codes: \n\n- `application/pdf`\n\
    - `image/jpeg`\n- `image/png`\n- `image/tiff`\n\nThe API will ignore other attachment types.\n\n####\
    \ X12 EDI 810\n\nX12 ingestion is opt-in — contact Vic.ai support to enable it for your\norganization.\n\
    \nRaw X12 EDI 810 invoice files (version 4010) are accepted — upload the file as\nyour supplier sends\
    \ it (a `.edi` or `.x12` file beginning with an `ISA`\nsegment), with no conversion. An interchange\
    \ may contain several invoices; each\ntransaction set becomes its own invoice, and Vic.ai renders\
    \ an image for each so\nit is processed like any other invoice.\n\nBecause processing happens asynchronously,\
    \ the upload response confirms only that\nthe file was received. Use `GET /v0/attachments/{id}` to\
    \ check whether processing\ncompleted and to retrieve the ids of the invoices that were created."
  humanURL: https://docs.vic.ai
  baseURL: https://api.us.vic.ai
