        id:
          type:
          - string
          - 'null'
          description: Internal dimension id.
        remote_id:
          type:
          - string
          - 'null'
          maxLength: 255
        type_remote_id:
          type:
          - string
          - 'null'
          maxLength: 255
        name:
          type:
          - string
          - 'null'
          maxLength: 255
    MonetaryValue:
