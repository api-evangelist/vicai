        name:
          type:
          - string
          - 'null'
          description: The cost account's name.
          example: Office Expenses
        number:
          type:
          - string
          - 'null'
          description: The cost account's number.
          example: '6100'
        remote_id:
          type:
          - string
          - 'null'
          description: The cost account's external ID.
          example: ext-cost-123
        sub_type:
          type:
          - string
          - 'null'
          description: The cost account's subtype.
          example: expense
        remote_updated_at:
          type:
          - string
          - 'null'
