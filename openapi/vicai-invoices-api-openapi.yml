      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: The UUID of the line item.
        index:
          type:
          - integer
          - 'null'
          description: The original index of this line item in the bill.
        description:
          type:
          - string
          - 'null'
          description: The line item description.
        number:
          type:
          - string
          - 'null'
          description: The item number.
        quantity_invoiced:
          type:
          - string
          - 'null'
          format: decimal
          description: The quantity invoiced for this line item.
        unit_price:
          type:
          - string
          - 'null'
          format: decimal
          description: The unit price.
        amount_tax:
          type:
          - string
          - 'null'
          format: decimal
          description: The tax amount.
        amount_net:
          type:
          - string
          - 'null'
          format: decimal
          description: The net amount.
        amount_sum:
          type:
          - string
          - 'null'
          format: decimal
          description: The total sum amount.
        amount_vat:
          type:
          - string
          - 'null'
          format: decimal
          description: The VAT amount.
        amount_freight:
          type:
          - string
          - 'null'
          format: decimal
          description: The freight amount.
        tax_code:
