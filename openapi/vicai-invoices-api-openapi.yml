      - start
      - count
      - unit
      properties:
        start:
          type: string
          format: date
          description: Accrual start date.
          example: '2024-01-01'
        count:
          type: integer
          description: Number of periods to spread over.
          example: 12
        unit:
          type: string
          enum:
          - MONTHS
          description: Time unit for accrual periods.
          example: MONTHS
    LineItemVat:
      type: object
      properties:
        internalId:
          oneOf:
          - type: string
            maxLength: 255
            description: 'The internal id of the VAT code. If specified, it will take

              precedence over the `externalId` and `code`.

              '
          - type: 'null'
        externalId:
          description: 'The external id of the VAT code. If specified, it will take

            precedence over the `code`.

            '
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        code:
          oneOf:
          - type: string
            maxLength: 255
            description: The VAT code.
          - type: 'null'
        amount:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
          description: 'The amount of VAT. This will be added to the line item''s total. If

