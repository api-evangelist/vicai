        unit:
          $ref: '#/components/schemas/AccrualTermUnit'
    PaginationV2:
      type: object
      properties:
        size:
          type: integer
          description: The page size.
          maximum: 50
          minimum: 1
        cursor:
          type: string
          description: The cursor to use to get the next page of results.
    UpdateInvoiceLineItem:
