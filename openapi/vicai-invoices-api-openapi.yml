          - string
          - 'null'
          format: decimal
          description: The quantity of things that were invoiced.
        comment:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The line item comment.
        description:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The description of the line item.
        billable:
          type:
          - boolean
          - 'null'
          description: Whether the line item is billable.
        taxCodeId:
          type:
          - string
          - 'null'
          format: uuid
          description: ID of Tax Code to use for the line item.
        vat:
          oneOf:
          - $ref: '#/components/schemas/LineItemVat'
          - type: 'null'
          description: The VAT information for the specific line item.
        costAccount:
          oneOf:
          - $ref: '#/components/schemas/CostAccountInfo'
          - type: 'null'
        dimensions:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/DimensionRef'
          - type: 'null'
        unitPrice:
          description: The price per unit of the item.
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
        number:
          description: The item number
          type:
          - string
          - 'null'
          maxLength: 255
        lineType:
          oneOf:
          - $ref: '#/components/schemas/InvoiceItemLineType'
          - type: 'null'
        memo:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Line item memo.
        poLineNumber:
          type:
          - integer
          - 'null'
          description: Purchase order line number.
        poNumber:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Purchase order number.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceFieldInput'
    AccrualV2:
      type: object
