            '
    VendorLookupByOrgNumberAndBankAccount:
      type: object
      required:
      - orgNumber
      - countryCode
      - bankAccount
      - bankAccountType
      properties:
        orgNumber:
          type: string
          maxLength: 255
          description: The org number of the vendor to aid in the predictions.
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        bankAccount:
          type: string
          maxLength: 255
          description: The bank account number that is attached to the vendor.
        bankAccountType:
          $ref: '#/components/schemas/BankAccountType'
          description: The type of bank account the bank account number is.
    PaymentMethod:
      type: string
      enum:
      - ach
      - card
      - check
      - wire
    ListInvoicesResponseV2:
      type: object
      required:
      - meta
      - data
      properties:
        meta:
          type: object
          required:
          - page
          properties:
            page:
              $ref: '#/components/schemas/PaginationMetaV2'
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillV2'
    InternalId:
      description: The internal id Vic uses for the record.
      type: string
      example: '47'
      readOnly: true
    InvoiceFieldInput:
      type: object
      required:
      - label
      properties:
        label:
          type: string
          maxLength: 255
          description: Field label/name.
          example: Project Code
        value:
          type:
          - string
          - 'null'
          maxLength: 255
          description: 'Field value. For `text` fields any printable string is accepted.

            For `select` fields the value must match one of the field''s

            configured options. For `date` fields the value must be an

            ISO 8601 calendar date (`YYYY-MM-DD`); empty strings clear the

            stored value.

            '
          example: PRJ-2024-001
    ErrorV2:
      type: object
      required:
      - message
      properties:
        field:
          description: 'The field that the error occurred on. This field may not always be

            present.

            '
          oneOf:
          - type: string
          - type: 'null'
        message:
          description: A description of the error.
          type: string
    InvoicePaymentInfo:
      type: object
      description: 'The invoice payment information.

        The `kind` field is required in order to determine what payment

        information the invoice needs to use.

        All other fields are optional and should be filled out as best seen fit.

        For `BBAN`, `IBAN`, `PLUSGIRO`, and `BANKGIRO` numbers use the

        `accountNumber` field.

        When using `IBAN` you should specify `bic`.

        '
      required:
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/PaymentKind'
        accountHolderName:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        accountNumber:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        routingNumber:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        bic:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
    InvoiceExternalPaymentStatus:
      type: string
      enum:
      - paid
      - unpaid
      - voided
    Invoices:
      type: array
      items:
        $ref: '#/components/schemas/Invoice'
    AccrualInfo:
      required:
      - start
      - count
      - unit
      properties:
        start:
          type: string
          format: date
        count:
          oneOf:
          - type: integer
          - type: 'null'
          description: 'The number of units from the `start`. The system _may_ have this field as

            `null` due to incomplete information or a user has cleared the information.

            However, when specifying the `count` to the api, it is required to be

            greater than `1`.

