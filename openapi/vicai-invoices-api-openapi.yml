              type:
              - string
              - 'null'
              format: uuid
              description: The tax code's internal ID.
            code:
              type:
              - string
              - 'null'
              description: The tax code.
            description:
              type:
              - string
              - 'null'
              description: The tax code description.
            rate:
              type:
              - string
              - 'null'
              format: decimal
              description: The tax rate.
        vat_code:
          type: object
          description: 'VAT code information for this child line item, retained from the

            original line item before merging.

            '
          properties:
            id:
              type:
              - string
              - 'null'
              format: uuid
              description: The VAT code's internal ID.
            remote_id:
              type:
              - string
              - 'null'
              description: The VAT code's external ID.
            code:
              type:
              - string
              - 'null'
              description: The VAT code.
              example: '25'
            rate:
              type:
              - string
              - 'null'
              format: decimal
              description: The VAT rate as a percentage.
              example: '0.25'
            description:
              type:
              - string
              - 'null'
