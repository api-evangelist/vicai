      properties:
        count:
          type: integer
          minimum: 1
        unit:
          $ref: '#/components/schemas/PaymentInfoTermUnit'
    MonetaryValue:
      description: 'The monetary value as a string.

        A float **should not** be used. The api will accept a float and it will be

        transformed into a monetary value, but for best results please use a string

        with the proper decimal precision.

        '
      type: string
      format: decimal
      example: '1.00'
    PurchaseOrderStatus:
      type: string
      description: The status of the purchase order.
      enum:
      - open
      - closed
      default: open
    CountryCode:
      description: 'The ISO-3166 country code. The acceptable values are Alpha-2 codes.

        '
      type: string
      format: ISO-3166
      maxLength: 2
      example: US
