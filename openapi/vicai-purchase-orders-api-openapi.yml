          description: Number of seconds to wait before retrying the request. Waiting this long guarantees the rate-limit window has reset.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ResourceNotFoundResponse:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PurchaseOrderDeletedResponse:
      description: Purchase order was successfully deleted.
    UnprocessableEntityResponse:
      description: Errors with the input are present.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenResponse:
      description: The request was forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  requestBodies:
    CreatePurchaseOrderRequest:
      description: Create a purchase order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatePurchaseOrder'
    UpdatePurchaseOrderRequest:
      description: Create a purchase order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdatePurchaseOrder'
  headers:
    NextPageToken:
      description: A link to the next page of responses
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
