          - type: 'null'
        bic:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
    BankAccountType:
      description: The type of bank account.
      enum:
      - ach
      - iban
      - bban
      - plusgiro
      - bankgiro
    Vendor:
      type: object
