          - type: 'null'
        description:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        phone:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        addressStreet:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        addressCity:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        addressState:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        addressPostalCode:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        countryCode:
          oneOf:
          - $ref: '#/components/schemas/CountryCode'
          - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        confirmedAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        state:
          $ref: '#/components/schemas/VendorState'
        taxInfo:
          $ref: '#/components/schemas/VendorTaxInfo'
        defaultPaymentInfo:
          $ref: '#/components/schemas/PaymentInfo'
        paymentTermId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
          description: The id of the `PaymentTerm` a vendor uses.
        poMatchingDocumentLevel:
          type: boolean
          description: Whether a vendor Purchase Order matching is document level
          default: false
        vendorGroupId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
          description: The `VendorGroup` id the vendor is attached to.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        externalData:
          oneOf:
          - $ref: '#/components/schemas/ExternalData'
          - type: 'null'
        errors:
          description: The errors that occurred in the external ERP system.
          items:
            $ref: '#/components/schemas/VendorRemoteError'
    Tag:
      type: object
      required:
      - value
      properties:
        id:
          type: string
        value:
          type: string
          maxLength: 255
  responses:
    PurchaseOrderResponse:
      description: The purchase order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurchaseOrder'
    SynchronizePurchaseOrdersResponse:
      description: 'A request to synchronize the purchase orders was acknowledged and is in

        the process of being ran.

        '
    ErrorResponse:
      description: An unexpected error has occurred. Check the body for more details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PurchaseOrdersResponse:
      description: A paged array of purchase orders
      headers:
        x-next:
          $ref: '#/components/headers/NextPageToken'
      content:
