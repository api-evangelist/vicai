openapi: 3.2.0
info:
  version: v10.40.4
  contact: {}
  title: Vic.ai Status API
  description: '## Introduction


    The Vic.ai API provides a seamless connection between your Enterprise Resource

    Planning (ERP) system and the Vic.ai product suite.'
servers:
- url: https://api.no.stage.vic.ai
  description: staging server, NO
- url: https://api.us.vic.ai
  description: production server, US
- url: https://api.no.vic.ai
  description: production server, NO
security:
- BearerAuth: []
tags:
- name: Status
  description: Status requests on the state of the Vic.ai system.
paths:
  /v0/healthCheck:
    get:
      description: Use this request to obtain a health check statement.
      summary: Health check
      operationId: healthCheck
      tags:
      - Status
      responses:
        '200':
          $ref: '#/components/responses/HealthyResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        4XX:
          $ref: '#/components/responses/ErrorResponse'
components:
  schemas:
    HealthCheck:
      type: object
      required:
      - status
      - version
      - company
      properties:
        status:
          type: string
          enum:
          - PASS
          - FAIL
          - WARN
        version:
          type: string
          format: semver
        company:
          type: string
    ErrorString:
      type: string
      maxLength: 255
    Error:
      description: 'generic error message in JSON format.  Note the ''code'' field should

        match the HTTP status code of the wrapping HTTP request.

        '
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          minimum: 100
          maximum: 599
        message:
          $ref: '#/components/schemas/ErrorString'
  responses:
    HealthyResponse:
      description: Successful health check response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthCheck'
    ErrorResponse:
      description: An unexpected error has occurred. Check the body for more details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsResponse:
      description: HTTP call rate limit exceeded.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request. Waiting this long guarantees the rate-limit window has reset.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
x-tagGroups:
- name: Integration
  tags:
  - Authentication
  - Pagination
  - Webhooks
  - Webhook Subscriptions
