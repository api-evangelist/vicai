openapi: 3.2.0
info:
  version: v10.40.4
  contact: {}
  title: Vic.ai Tax Codes API
  description: '## Introduction


    The Vic.ai API provides a seamless connection between your Enterprise Resource

    Planning (ERP) system and the Vic.ai product suite.'
servers:
- url: https://api.no.stage.vic.ai
  description: staging server, NO
- url: https://api.us.vic.ai
  description: production server, US
- url: https://api.no.vic.ai
  description: production server, NO
security:
- BearerAuth: []
tags:
- name: Tax Codes
  description: The tax codes.
paths:
  /v0/taxCodes:
    post:
      summary: Creates a company's tax code
      operationId: createTaxCode
      tags:
      - Tax Codes
      requestBody:
        $ref: '#/components/requestBodies/CreateTaxCode'
      responses:
        '201':
          $ref: '#/components/responses/TaxCodeResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        4XX:
          $ref: '#/components/responses/ErrorResponse'
    get:
      summary: Get the list of tax codes for a company
      operationId: getTaxCodes
      tags:
      - Tax Codes
      responses:
        '200':
          $ref: '#/components/responses/TaxCodeResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        4XX:
          $ref: '#/components/responses/ErrorResponse'
components:
  requestBodies:
    CreateTaxCode:
      description: Create a tax code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTaxCode'
  schemas:
    CreateTaxCode:
      required:
      - code
      - description
      - rate
      properties:
        code:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
          example: Tax code description
        rate:
          type: string
          format: decimal
          example: '0.25'
    ErrorString:
      type: string
      maxLength: 255
    Error:
      description: 'generic error message in JSON format.  Note the ''code'' field should

        match the HTTP status code of the wrapping HTTP request.

        '
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          minimum: 100
          maximum: 599
        message:
          $ref: '#/components/schemas/ErrorString'
    TaxCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
          example: Tax code description
        rate:
          type: string
          format: decimal
          example: '0.25'
  responses:
    ErrorResponse:
      description: An unexpected error has occurred. Check the body for more details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TaxCodeResponse:
      description: A tax code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaxCode'
    TooManyRequestsResponse:
      description: HTTP call rate limit exceeded.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request. Waiting this long guarantees the rate-limit window has reset.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
