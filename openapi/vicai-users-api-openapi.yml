            properties:
              data:
                $ref: '#/components/schemas/UserV2'
    CompanyUserRolesResponseV2:
      description: The user's current roles within the company.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanyUserRolesV2'
    ListOrganizationUsersResponseV2:
      description: A successful list of users attached to an organization.
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/PaginationMetaV2'
              data:
                type: array
                items:
                  $ref: '#/components/schemas/UserV2'
    CreateCompanyUserResponseV2:
      description: User was created and attached to the company successfully.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanyUserMetaV2'
    ListCompanyUsersResponseV2:
      description: A successful list of users
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/PaginationMetaV2'
              data:
                type: array
                items:
                  $ref: '#/components/schemas/UserV2'
  parameters:
    PaginationV2:
      name: page
      in: query
      schema:
        $ref: '#/components/schemas/PaginationV2'
  securitySchemes:
