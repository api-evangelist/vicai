openapi: 3.2.0
info:
  version: v10.40.4
  contact: {}
  title: Vic.ai Webhook Events API
  description: '## Introduction


    The Vic.ai API provides a seamless connection between your Enterprise Resource

    Planning (ERP) system and the Vic.ai product suite.'
servers:
- url: https://api.no.stage.vic.ai
  description: staging server, NO
- url: https://api.us.vic.ai
  description: production server, US
- url: https://api.no.vic.ai
  description: production server, NO
security:
- BearerAuth: []
tags:
- name: Webhook Events
  description: These are the `V1` events you can subscribe to.
paths:
  /v0/webhooks/events:
    get:
      description: 'Use this request to query webhook events that are stored in Vic.ai.

        Events include invoice processing, vendor updates, payment processing,

        purchase orders, and other system activities that trigger webhook notifications.


        An event is recorded only if, at the time it is generated, a subscription''s

        event types include it. Events generated before such a subscription existed

        are not stored, so this endpoint returns the events recorded for the company

        rather than a complete history of all account activity.'
      summary: List webhook events
      operationId: listWebhookEvents
      tags:
      - Webhook Events
      x-badges:
      - name: Beta
        position: after
        color: orange
      parameters:
      - $ref: '#/components/parameters/PagingLimit'
      - $ref: '#/components/parameters/PagingCursor'
      - $ref: '#/components/parameters/WebhookEventTypes'
      - $ref: '#/components/parameters/OccurredAfter'
      - $ref: '#/components/parameters/OccurredBefore'
      - $ref: '#/components/parameters/WebhookUndeliveredFilter'
      responses:
        '200':
          $ref: '#/components/responses/WebhookEventsResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        4XX:
          $ref: '#/components/responses/ErrorResponse'
  /v0/webhooks/events/{event_id}:
    get:
      description: Use this request to get data for a specific webhook event details
      summary: Get a webhook event
      operationId: getWebhookEvent
      tags:
      - Webhook Events
      x-badges:
      - name: Beta
        position: after
        color: orange
      parameters:
      - $ref: '#/components/parameters/WebhookEventId'
      responses:
        '200':
          $ref: '#/components/responses/WebhookEventResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        4XX:
          $ref: '#/components/responses/ErrorResponse'
  /v2/webhook_event_types:
    get:
      description: 'Use this request to get all available webhook event types that can be

        subscribed to in Vic.ai. This includes event types for invoices,

        vendors, payments, purchase orders, and other system activities.'
      summary: List webhook event types
      operationId: listWebhookEventTypesV2
      tags:
      - Webhook Events
      x-badges:
      - name: V2
        position: after
        color: blue
      - name: Beta
        position: after
        color: orange
      responses:
        '200':
          $ref: '#/components/responses/WebhookEventTypesResponseV2'
        4XX:
          $ref: '#/components/responses/ErrorResponseV2'
  /v2/companies/{company_id}/webhook/events:
    get:
      description: 'Use this request to query the webhook events stored for a specific company.


        An event is recorded only if, at the time it is generated, the company has a

        subscription whose event types include it. Events generated before such a

        subscription existed are not stored and cannot be retrieved here, so this

        endpoint returns the events recorded for the company rather than a complete

        history of all account activity.'
      summary: List webhook events by company
      operationId: listCompanyWebhookEventsV2
      tags:
      - Webhook Events
      x-badges:
      - name: V2
        position: after
        color: blue
      - name: Beta
        position: after
        color: orange
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/WebhookEventType'
      - $ref: '#/components/parameters/WebhookEventTypes'
      - $ref: '#/components/parameters/OccurredAfter'
      - $ref: '#/components/parameters/OccurredBefore'
      - $ref: '#/components/parameters/WebhookUndeliveredFilter'
      - $ref: '#/components/parameters/PaginationV2'
      responses:
        '200':
          $ref: '#/components/responses/WebhookEventsResponseV2'
        4XX:
          $ref: '#/components/responses/ErrorResponseV2'
  /v2/companies/{company_id}/webhook/events/{event_id}:
    get:
      description: 'Use this request to get detailed information about a specific webhook event for a

        company that is stored in Vic.ai. This includes delivery attempts, payload data, and status information.'
      summary: Get a webhook event by company
      operationId: getCompanyWebhookEventV2
      tags:
      - Webhook Events
      x-badges:
      - name: V2
        position: after
        color: blue
      - name: Beta
        position: after
        color: orange
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/WebhookEventId'
      responses:
        '200':
          $ref: '#/components/responses/WebhookEventResponseV2'
        '404':
          $ref: '#/components/responses/ResourceNotFoundResponse'
        4XX:
          $ref: '#/components/responses/ErrorResponseV2'
components:
  schemas:
    WebhookEventsListV2:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
          description: List of webhook events
        meta:
          type: object
          required:
          - page
          properties:
            page:
              $ref: '#/components/schemas/PaginationMetaV2'
    WebhookEventsList:
      type: array
      items:
        $ref: '#/components/schemas/WebhookEvent'
    WebhookEventTypeName:
      type: string
      description: A webhook event type.
      enum:
      - invoicePost
      - invoiceTransfer
      - vendorNew
      - syncRequest
      - payment_batch_processed
      - payment_status_updated
      - credit_status_updated
      - invoice_approved
      - invoice_deleted
      - invoice_restored
      - invoice_post
      - invoice_posted
      - invoice_rejected
      - invoice_submitted
      - invoice_transfer
      - invoice_updated
      - purchase_order_created
      - purchase_order_updated
      - purchase_order_deleted
      - vendor_created
      - vendor_updated
      - vendor_onboarding_form_completed
      - ping
    WebhookEventV2:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/WebhookEvent'
    WebhookEvent:
      type: object
      required:
      - id
      - type
      - version
      - occurred_at
      - body
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the webhook event
        type:
          type: string
          description: The type of event that occurred
          example: invoice_approved
        version:
          type: integer
          description: Version of the event schema
          example: 1
        occurred_at:
          type: string
          format: date-time
          description: When the event occurred
        body:
          type: object
          description: Event-specific payload data
    WebhookEventTypesList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            type: string
          description: List of available webhook event type names
          example:
          - invoice_approved
          - invoice_posted
          - invoice_rejected
          - invoice_updated
          - payment_batch_processed
          - payment_status_updated
          - credit_status_updated
          - purchase_order_created
          - purchase_order_deleted
          - purchase_order_updated
          - vendor_created
          - vendor_onboarding_form_completed
          - vendor_updated
          - ping
    ErrorV2:
      type: object
      required:
      - message
      properties:
        field:
          description: 'The field that the error occurred on. This field may not always be

            present.

            '
          oneOf:
          - type: string
          - type: 'null'
        message:
          description: A description of the error.
          type: string
    ErrorString:
      type: string
      maxLength: 255
    PaginationMetaV2:
      type: object
      properties:
        cursor:
          description: 'The cursor to the next page of data. If it is null, that means there

            is no more data to fetch.

            '
          oneOf:
          - type: string
          - type: 'null'
    Error:
      description: 'generic error message in JSON format.  Note the ''code'' field should

        match the HTTP status code of the wrapping HTTP request.

        '
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          minimum: 100
          maximum: 599
        message:
          $ref: '#/components/schemas/ErrorString'
    PaginationV2:
      type: object
      properties:
        size:
          type: integer
          description: The page size.
          maximum: 50
          minimum: 1
        cursor:
          type: string
          description: The cursor to use to get the next page of results.
  responses:
    WebhookEventResponseV2:
      description: A single webhook event with delivery information (V2 format)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookEventV2'
    ErrorResponseV2:
      description: An unexpected error has occurred. Check the body for more details.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorV2'
    ResourceNotFoundResponse:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WebhookEventResponse:
      description: A single webhook event.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookEvent'
    WebhookEventsResponseV2:
      description: A paged list of webhook events (V2 format)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookEventsListV2'
    TooManyRequestsResponse:
      description: HTTP call rate limit exceeded.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request. Waiting this long guarantees the rate-limit window has reset.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorResponse:
      description: An unexpected error has occurred. Check the body for more details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WebhookEventTypesResponseV2:
      description: A list of available webhook event types
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookEventTypesList'
    WebhookEventsResponse:
      description: A paged array of webhook events
      headers:
        x-next:
          $ref: '#/components/headers/NextPageToken'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookEventsList'
  parameters:
    OccurredBefore:
      name: occurred_before
      in: query
      description: Filter events that occurred on or before this date. Required parameter. The date range between occurred_after and occurred_before cannot exceed 30 days.
      required: true
      schema:
        type: string
        format: date-time
    CompanyId:
      name: company_id
      in: path
      required: true
      description: The ID of the company
      schema:
        type: string
        format: uuid
    WebhookUndeliveredFilter:
      name: undelivered
      in: query
      description: Filter to show only events that have not been delivered
      required: false
      schema:
        type: boolean
    PagingLimit:
      name: limit
      in: query
      description: How many items to return at one time (max 100) (default 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    OccurredAfter:
      name: occurred_after
      in: query
      description: Filter events that occurred on or after this date. Required parameter. The date range between occurred_after and occurred_before cannot exceed 30 days.
      required: true
      schema:
        type: string
        format: date-time
    WebhookEventTypes:
      name: event_types
      in: query
      description: 'Filter events by one or more types, given as a comma-separated list

        (for example `invoice_posted,invoice_approved`). Omit to return events

        of every type.

        '
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/WebhookEventTypeName'
    PaginationV2:
      name: page
      in: query
      schema:
        $ref: '#/components/schemas/PaginationV2'
    WebhookEventId:
      name: event_id
      in: path
      required: true
      description: The ID of the webhook event
      schema:
        type: string
        format: uuid
    PagingCursor:
      name: cursor
      in: query
      description: Which item to start from. See [Pagination](#section/Pagination) for more information.
      required: false
      schema:
        type: string
    WebhookEventType:
      name: event_type
      in: query
      description: 'Filter events by a single type. Omit the parameter to return events of

        every type. To filter by several types at once, use `event_types`

        instead.

        '
      required: false
      schema:
        $ref: '#/components/schemas/WebhookEventTypeName'
  headers:
    NextPageToken:
      description: A link to the next page of responses
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
x-tagGroups:
