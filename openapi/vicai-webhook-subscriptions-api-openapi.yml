            description: 'This is set when a credit has been voided by the payment processor.

              Generally this would happen due to a `Vendor` missing address

              information or a malformed `Invoice` was trying to be paid. Other

              cases could cause this to be voided due to insufficient funds.

              '
          - type: 'null'
        confirmedAt:
          oneOf:
          - type: string
            format: date-time
            description: The datetime when the credit was confirmed in an external system.
          - type: 'null'
        remoteId:
          oneOf:
          - type: string
            maxLength: 255
            description: An external identifier for the credit in the confirming system.
          - type: 'null'
        remoteError:
          oneOf:
          - type: string
            description: An error message if the confirmation failed.
          - type: 'null'
        remoteErroredAt:
          oneOf:
          - type: string
            format: date-time
            description: When the remote error occurred.
          - type: 'null'
        invoice:
          $ref: '#/components/schemas/InvoiceRef'
        costAccount:
          $ref: '#/components/schemas/CostAccountRef'
        vendor:
          $ref: '#/components/schemas/VendorRef'
    Payment:
      type: object
      description: 'The payment made for an `Invoice`. The `Account` assigned to the

        payment is where the funds are being debited from.

        '
      properties:
        id:
          type: string
          format: uuid
          description: The id of the credit.
        batchId:
          type: string
          format: uuid
          description: The id of the payment batch the payment belongs to.
        amount:
          $ref: '#/components/schemas/MonetaryValue'
        settlementAmount:
          $ref: '#/components/schemas/MonetaryValue'
        discountAmount:
          description: 'The discount amount applied using the `PaymentTerm` on the vendor.

            The `discountAmount + amount` should be equal to the `Invoice`

            amount due in most cases. Accountants are allowed to make partial

            payments. Typically when partial payments are made, `discountAmount`

            will be `0.00`.

            '
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
        currencyId:
          $ref: '#/components/schemas/Currency'
        settlementCurrencyId:
          $ref: '#/components/schemas/Currency'
        exchangeRate:
          $ref: '#/components/schemas/MonetaryValue'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paymentMethod:
          oneOf:
          - $ref: '#/components/schemas/PaymentMethod'
          - type: 'null'
        referenceId:
          oneOf:
          - $ref: '#/components/schemas/PaymentReferenceId'
          - type: 'null'
        approvedAt:
          oneOf:
          - type: string
            format: date-time
            description: The payment approver has approved the payment.
          - type: 'null'
        failedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the payment was marked as failed.
        failedReason:
          type:
          - string
          - 'null'
          description: The reason why the payment failed.
        fundedAt:
          oneOf:
          - type: string
            format: date-time
            description: 'The date time the payment request began to be processed.


              **Note**: This is not the actual date time that the funds were

              withdrawn from the bank. The payment request can take 15

              minutes to 4 hours or more to be processed. See the `acceptedAt`

              field for the date time that the payment was submitted and

              accepted.

              '
          - type: 'null'
        acceptedAt:
          oneOf:
          - type: string
            format: date-time
            description: 'The date time the payment request was submitted and accepted

              for processing.

              '
          - type: 'null'
        rejectedAt:
          oneOf:
          - type: string
            format: date-time
            description: The payment approver has rejected the payment.
          - type: 'null'
        voidedAt:
          oneOf:
          - type: string
            format: date-time
            description: 'This is set when a credit has been voided by the payment processor.

              Generally this would happen due to a `Vendor` missing address

              information or a malformed `Invoice` was trying to be paid. Other

              cases could cause this to be voided due to insufficient funds.

              '
          - type: 'null'
        confirmedAt:
          oneOf:
          - type: string
            format: date-time
            description: The datetime when the payment was confirmed in an external system.
          - type: 'null'
        remoteId:
          oneOf:
          - type: string
            maxLength: 255
            description: An external identifier for the payment in the confirming system.
          - type: 'null'
        remoteError:
          oneOf:
          - type: string
            description: An error message if the confirmation failed.
          - type: 'null'
        remoteErroredAt:
          oneOf:
          - type: string
            format: date-time
            description: When the remote error occurred.
          - type: 'null'
        invoice:
          $ref: '#/components/schemas/InvoiceRef'
        costAccount:
          $ref: '#/components/schemas/CostAccountRef'
        vendor:
          $ref: '#/components/schemas/VendorRef'
    PaymentBatch:
      type: object
      description: A batch of payments made with Vic.
      properties:
        id:
          type: string
          format: uuid
          description: The id of the payment batch in Vic.
        name:
          type: string
          description: The name of the payment batch that the accountant has set.
        companyId:
          type: string
          description: The id of the `Company` in Vic.
        processedAt:
          oneOf:
          - type: string
            format: date-time
            description: 'The date time of when the payment was sent to the payment

              processor.

              '
          - type: 'null'
        completedAt:
          oneOf:
          - type: string
            format: date-time
            description: 'The date time of when all of the payments have been submitted to

              the bank accounts.

              '
          - type: 'null'
        approvedAt:
          oneOf:
          - type: string
            format: date-time
            description: 'The payment approver has approved the batch of payments and will

              be scheduled to be processed.

              '
          - type: 'null'
        rejectedAt:
          oneOf:
          - type: string
            format: date-time
            description: 'This is set when the payment approver has rejected the entire

              batch of payments. Each `Payment` and `Credit` will have their

              `rejectedAt` fields also set.

              '
          - type: 'null'
        voidedAt:
          oneOf:
          - type: string
            format: date-time
            description: 'This is set when an entire batch of payments was voided.

              Generally this would happen due to a `Vendor` missing address

              information or a malformed `Invoice` was trying to be paid. Other

              cases could cause this to be voided due to insufficient funds.

              '
          - type: 'null'
        status:
          $ref: '#/components/schemas/PaymentBatchStatus'
        payments:
          type: array
          minItems: 1
          maxItems: 100
          description: Array of payment confirmation items. Must contain at least one item and no more than 100 items.
          items:
            $ref: '#/components/schemas/Payment'
        credits:
          type: array
          minItems: 1
          maxItems: 100
          description: Array of credit confirmation items. Must contain at least one item and no more than 100 items.
          items:
            $ref: '#/components/schemas/Credit'
    PaymentMethod:
      type: string
      enum:
      - ach
      - card
      - check
      - wire
    UnitOfMeasure:
      type: string
      example: kg
      maxLength: 255
      description: The unit of measure used.
    InternalId:
      description: The internal id Vic uses for the record.
      type: string
      example: '47'
      readOnly: true
    PurchaseOrderCreatedEvent:
      type: object
      required:
      - id
      - occurred_at
      - event
      - data
      properties:
        id:
          type: string
          description: The ID of the event. This is idempotent.
          format: uuid
        occurred_at:
          type: string
          description: The date and time the event occurred.
          format: date-time
        event:
          type: string
          enum:
          - purchase_order_created
        data:
          $ref: '#/components/schemas/PurchaseOrder'
    ErrorV2:
      type: object
      required:
      - message
      properties:
        field:
          description: 'The field that the error occurred on. This field may not always be

            present.

            '
          oneOf:
          - type: string
          - type: 'null'
        message:
          description: A description of the error.
          type: string
    InvoiceExternalPaymentStatus:
      type: string
      enum:
      - paid
      - unpaid
      - voided
    UnsubscribeResult:
      type: string
      enum:
      - OK
    AccrualInfo:
      required:
      - start
      - count
      - unit
      properties:
        start:
          type: string
          format: date
        count:
          oneOf:
          - type: integer
          - type: 'null'
          description: 'The number of units from the `start`. The system _may_ have this field as

            `null` due to incomplete information or a user has cleared the information.

            However, when specifying the `count` to the api, it is required to be

            greater than `1`.

            '
        unit:
          $ref: '#/components/schemas/AccrualTermUnit'
    PaginationV2:
      type: object
      properties:
        size:
          type: integer
          description: The page size.
          maximum: 50
          minimum: 1
        cursor:
          type: string
          description: The cursor to use to get the next page of results.
    LineItemVat:
      type: object
      properties:
        internalId:
          oneOf:
          - type: string
            maxLength: 255
            description: 'The internal id of the VAT code. If specified, it will take

              precedence over the `externalId` and `code`.

              '
          - type: 'null'
        externalId:
          description: 'The external id of the VAT code. If specified, it will take

            precedence over the `code`.

            '
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        code:
          oneOf:
          - type: string
            maxLength: 255
            description: The VAT code.
          - type: 'null'
        amount:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
          description: 'The amount of VAT. This will be added to the line item''s total. If

            the VAT amount is unknown, this should be left `NULL` or

            unspecified.

            '
        rate:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
          description: 'The amount of VAT percentage. If the VAT percentage is unknown, this

            should be left `NULL` or unspecified.

            '
    VendorRef:
      type: object
      description: A reference to a `Vendor`.
      properties:
        internalId:
          oneOf:
          - $ref: '#/components/schemas/VendorInternalId'
          - type: 'null'
        externalId:
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
    PaymentInfoMethod:
      type: string
      description: 'The payment method to be used.

        Note: `BANKACCOUNT` is equivalent to `ACH` in the Web UI.

        '
      enum:
      - BANKACCOUNT
      - BANKGIRO
      - PLUSGIRO
      - IBAN
      - BBAN
    InvoiceBillStatus:
      type: string
      enum:
      - PAID
      - PARTIALLY_PAID
      - PENDING
      - PROCESSING
      - REJECTED
      - SCHEDULED
      - UNPAID
      - VOIDED
    SubscriptionsListV2:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionV2'
          description: List of subscriptions
        meta:
          type: object
          required:
          - page
          properties:
            page:
              $ref: '#/components/schemas/PaginationMetaV2'
    InvoicePostedEvent:
      type: object
      required:
      - id
      - occurred_at
      - event
      - data
      properties:
        id:
          type: string
          description: The ID of the event. This is idempotent.
          format: uuid
        occurred_at:
          type: string
          description: The date and time the event occurred.
          format: date-time
        event:
          type: string
          enum:
          - invoice_posted
        data:
          $ref: '#/components/schemas/Invoice'
    CustomField:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        value:
          type: string
          maxLength: 255
        label:
          type: string
          maxLength: 255
    Dimension:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          description: The name of the dimension.
        type:
          type: string
          maxLength: 255
          description: The dimension type.
        typeName:
          type: string
          maxLength: 255
          description: The dimension type name. A human friendly type name.
        typeExternalId:
          type: string
          maxLength: 255
          description: The dimension type's external ID in the ERP system.
        shortName:
          type: string
          maxLength: 255
        externalData:
          oneOf:
          - $ref: '#/components/schemas/ExternalData'
          - type: 'null'
        displayName:
          type: string
        internalId:
          $ref: '#/components/schemas/InternalId'
        internalUpdatedAt:
          type: string
          description: Is in UTC.
          format: date-time
        externalId:
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        externalUpdatedAt:
          type: string
          format: date-time
          description: Does not have UTC normalization.
    Language:
      type: string
      maxLength: 2
      example: en
    RequestIdCallback:
      type: object
      required:
      - requestId
      properties:
        requestId:
          type: string
          format: uuid
        companyId:
          type: string
          description: The ID of the company that is requesting the sync.
          example: '12345'
    PaymentBatchProcessedEvent:
      type: object
      required:
      - event
      - data
      properties:
        event:
          type: string
          enum:
          - payment_batch_processed
        data:
          $ref: '#/components/schemas/PaymentBatch'
    InvoiceLineItem:
      type: object
      required:
      - costAccountExternalId
      - dimensionsExternalIds
      - amount
      properties:
        index:
          description: 'A non-negative integer indicating where the line item is in the

            document. No two line items shall be allowed to have the same index.

            If unspecified, it will be inferred based on its position. If

            another line item has an index set, and the current line item is

            left null, it will take the next highest value.

            '
          type: integer
        internalId:
          oneOf:
          - $ref: '#/components/schemas/InternalId'
          - type: 'null'
          description: The internal ID of the line item. Not present for grouped line items.
        amount:
          deprecated: true
          description: '**Note**: this will be removed in the future, please use

            `amountSum` instead.

            '
          type: number
        amountTax:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          description: The amount of tax on the invoice line item.
        amountNet:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          description: The net amount of the line item, excluding tax and freight.
        amountSum:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          description: The total sum amount of the line item, including tax/VAT and freight.
        amountFreight:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          description: The freight amount of the line item.
        description:
          type: string
        comment:
          type: string
        billable:
          type: boolean
          default: false
        accrual:
          $ref: '#/components/schemas/AccrualInfo'
        invoiceLineItemInfo:
          oneOf:
          - $ref: '#/components/schemas/InvoiceLineItemInfo'
          - type: 'null'
        vat:
          oneOf:
          - $ref: '#/components/schemas/LineItemVat'
          - type: 'null'
        taxCode:
          oneOf:
          - $ref: '#/components/schemas/TaxCode'
          - type: 'null'
        costAccountInternalId:
          oneOf:
          - $ref: '#/components/schemas/InternalId'
          - type: 'null'
          deprecated: true
          description: Use `costAccount` instead.
        costAccountExternalId:
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
          deprecated: true
          description: Use `costAccount` instead.
        costAccount:
          oneOf:
          - $ref: '#/components/schemas/CostAccountInfo'
          - type: 'null'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/Dimension'
        dimensionsInternalIds:
          deprecated: true
          description: Use `dimensions` instead.
          type: array
          items:
            $ref: '#/components/schemas/InternalId'
        dimensionsExternalIds:
          deprecated: true
          description: Use `dimensions` instead.
          type: array
          items:
            $ref: '#/components/schemas/ExternalId'
        quantityInvoiced:
          description: The quantity of things that were invoiced.
          type: string
          format: decimal
        lineItemTotal:
          description: The line item total
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
        lineType:
          oneOf:
          - $ref: '#/components/schemas/InvoiceItemLineType'
          - type: 'null'
        poLineNumber:
          oneOf:
          - type: integer
          - type: 'null'
          description: The line number in a matched purchase order.
        poNumber:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: The matched purchase order number.
        poItemsMatched:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MatchItem'
        poReceiptLinesMatched:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PurchaseOrderReceiptMatch'
        unitPrice:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
        number:
          description: The item number
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        lineFields:
          type: array
          description: 'This has been deprecated. Please use the `fields` field instead.

            This will be removed on 2025-08-12.

            '
          items:
            $ref: '#/components/schemas/InvoiceField'
        fields:
          type: array
          description: 'Custom fields configured for this invoice line item. These are

            company-specific fields that can be used to capture additional

            metadata or categorization information for line items.

            '
          items:
            $ref: '#/components/schemas/InvoiceField'
        childItems:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/InvoiceLineItemChild'
          - type: 'null'
          description: 'When invoice is document-level matched, multiple line items may be

            grouped into a single merged line item. This field contains the original

            line items that were merged. Empty when the group contains only one item,

            populated with 2+ items when multiple line items were grouped together.

            Null when invoice is not document-level matched.

            '
    DimensionRef:
      type: object
      description: 'A reference to a dimension within Vic.

        The `internalId` takes precedence over all fields specified. If a

        dimension is not found matching the `internalId` an error will be

        returned.

        When `externalId` is provided, it takes precedence over `name` and can

        be used in combination with `typeExternalId`.

        If `name` is the only field specified and more than one dimension exists

        with that `name`, then an error will be returned. It can be used in

        combination with `typeExternalId`.

        If `typeExternalId` is specified with `externalId` or `name` and more

        than one dimension exists with those fields, then an error will be

        returned.

        '
      properties:
        internalId:
          oneOf:
          - type: string
            maxLength: 255
            description: 'Vic''s id of the dimension.

              Takes precedence over all other fields. Other fields are ignored if

              this is specified.

              '
          - type: 'null'
        externalId:
          description: 'The id of the dimension in the ERP.

            Takes precedence over `name`. Can be used in combination with

            `typeExternalId`.

            If more than one dimension is found meeting the criteria specified,

            an error will be returned.

            '
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        name:
          oneOf:
          - type: string
            maxLength: 255
            description: 'The name of the dimension.

              Can be used in combination with `typeExternalId`.

              If more than one dimension is found meeting the criteria specified,

              an error will be returned.

              '
          - type: 'null'
        typeExternalId:
          description: 'The type id in the ERP.

            This is a supplemental field to be used with `externalId` or `name`.

            '
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
    BillOfLadingNumber:
      description: The bill of lading number.
      type: object
      required:
      - bolNumber
      properties:
        bolNumber:
          type: string
          description: Bill of Lading number.
          minLength: 1
          maxLength: 255
          example: BOL-123456
    PurchaseOrderMatchingType:
      type: string
      description: The matching type of the purchase order.
      enum:
      - document
      - line
    PurchaseOrderLineItem:
      type: object
      required:
      - internalId
      properties:
        internalId:
          type: string
          maxLength: 255
        externalId:
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        productNumber:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        productDescription:
          type: string
          maxLength: 255
        unitOfMeasure:
          oneOf:
          - $ref: '#/components/schemas/UnitOfMeasure'
          - type: 'null'
        quantityAccepted:
          description: The quantity accepted. Required when `matchingType` set to `four_way`.
          type: string
          format: decimal
          example: '1.0'
        quantityRequested:
          description: The quantity requested. Required for all `matchingType` values.
          type: string
          format: decimal
          example: '1.0'
        quantityReceived:
          description: The quantity received. Required when `matchingType` set to `three_way` (default) or `four_way`.
          type: string
          format: decimal
          example: '1.0'
        matchingType:
          $ref: '#/components/schemas/PurchaseOrderLineItemMatchingType'
        unitAmount:
          oneOf:
          - $ref: '#/components/schemas/NonNegativeMonetaryValue'
          - type: 'null'
          description: The per-unit amount.
        lineItemTotal:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
          description: The line item total.
        lineNumber:
          description: The line number of the item in the purchase order.
          type: integer
          minimum: 1
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/DimensionRef'
        invoiceItemsMatched:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MatchItem'
        receiptMatches:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PurchaseOrderReceiptMatch'
        memo:
          description: Optional memo for the purchase order line item.
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        status:
          $ref: '#/components/schemas/PurchaseOrderLineItemStatus'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLineField'
        receiptLines:
          type: array
          description: Receipt lines associated with this purchase order line item.
          items:
            $ref: '#/components/schemas/PurchaseOrderReceiptLine'
        scheduleLines:
          type: array
          description: Schedule lines associated with this purchase order line item.
          items:
            $ref: '#/components/schemas/PurchaseOrderScheduleLine'
    FieldError:
      description: 'Data structure for describing an error associated with a specific

        field in another datastructure.

        - internalField represents the Vic.API field name

        - externalField represents the associated field name in the ERP

        '
      type: object
      required:
      - internalField
      - externalField
      - message
      properties:
        internalField:
          $ref: '#/components/schemas/ErrorString'
        externalField:
          $ref: '#/components/schemas/ErrorString'
        message:
          $ref: '#/components/schemas/ErrorString'
    CreateSubscriptionV2:
      type: object
      required:
      - callback_url
      - access_token
      properties:
        callback_url:
          type: string
          format: uri
          description: The HTTPS URL where webhook events will be sent
          maxLength: 2048
          example: https://your-api.example.com/webhooks
        access_token:
          type: string
          description: Access token for authenticating webhook deliveries
          maxLength: 1024
          example: your-access-token
        username:
          type: string
          description: Username for Basic authentication (required when auth_method is 'basic')
          maxLength: 255
          example: api_user
        auth_method:
          type: string
          enum:
          - bearer
          - basic
          description: Authentication method for webhook delivery
          default: bearer
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventName'
          description: List of event types to subscribe to.
          default:
          - all
          example:
          - invoice_posted
          - invoice_approved
    Invoice:
      type: object
      required:
      - transactionType
      - refNumber
      - poNumber
      - description
      - currency
      - language
      - lineItems
      - status
      properties:
        totalAmount:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          deprecated: true
          description: 'The total amount of the invoice, including tax/VAT.

            This field is deprecated. Please use `amountSum` instead.

            '
        totalVatAmount:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
          deprecated: true
          description: 'The total VAT amount of the invoice. Only for companies with

            "VAT for PO invoices" tax handling.

            This field is deprecated. Please use `amountVat` instead.

            '
        amountWithoutTax:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          deprecated: true
          description: 'The total amount of the invoice, excluding tax.

            This field is deprecated. Please use `amountNet` instead.

            '
        amountTax:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          description: The total amount of tax on the invoice.
        amountNet:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          description: The net amount of the invoice, excluding tax, VAT, and freight.
        amountVat:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
          description: The total VAT amount of the invoice.
        amountSum:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          description: The total sum amount of the invoice, including tax, VAT, and freight.
        amountFreight:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          description: The freight amount of the invoice.
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        refNumber:
          description: number that appears on the invoice
          type: string
          maxLength: 255
        matchedPurchaseOrders:
          type: array
          items:
            $ref: '#/components/schemas/MatchedPurchaseOrder'
        poNumber:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
          deprecated: true
          description: 'Deprecated. Echoes the first element of

            `purchaseOrderNumbers` (or `null` if no POs are associated)

            for backward compatibility. New integrations should read the

            full list from `purchaseOrderNumbers`.

            '
        purchaseOrderNumbers:
          type: array
          items:
            type: string
            maxLength: 255
          description: 'List of purchase order numbers associated with the invoice,

            sorted by stable insertion order. Empty when no POs are

            associated.

            '
          default: []
          example:
          - PO-1001
          - PO-1002
        description:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/CustomField'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceField'
        language:
          oneOf:
          - $ref: '#/components/schemas/Language'
          - type: 'null'
        issueDate:
          type: string
          format: date
        glDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        paymentInfo:
          $ref: '#/components/schemas/PaymentInfo'
        invoiceInfo:
          $ref: '#/components/schemas/InvoiceInfoNO'
        source:
          oneOf:
          - type: string
            example: Millum
            maxLength: 255
          - type: 'null'
          description: Where the invoice originates from.
        internalId:
          type: string
          description: Deprecated. If you are integrating with v2, please use `id` instead.
        id:
          type: string
          description: 'For v2 and onward, this will be the unique internal ID of the invoice.

            '
        insertedAt:
          type: string
          description: The date time in UTC when the record was created.
          format: date-time
          example: '2024-01-15T10:30:00Z'
        internalUpdatedAt:
          type: string
          description: The date time in UTC when the record was updated at.
          format: date-time
          example: '2024-01-15T10:30:00Z'
        automatedAt:
          description: 'The date time in UTC when the invoice was selected for AutoPilot

            (full automation), or `null` if it was never automated.

            '
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          example: '2024-01-15T10:30:00Z'
        companyId:
          type: string
          description: The ID of the company that owns this invoice.
          example: '12345'
        companyExternalId:
          type: string
          description: The external ID of the company that owns this invoice.
          example: CO-123
        externalId:
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
          description: The id of the invoice within the ERP system.
        paymentTermId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
          description: The id of the `PaymentTerm` a vendor uses.
        externalUpdatedAt:
          type: string
          description: 'The date time when the invoice was updated in the ERP system. This

            does not have UTC normalization.

            '
          format: date-time
        paymentTerm:
          oneOf:
          - $ref: '#/components/schemas/InvoicePaymentTerm'
          - type: 'null'
          description: 'The payment term the invoice should be paid in. If the term is not

            known, pass `null` here.

            '
        paymentRef:
          description: 'The payment reference number. The KID is a customer identification

            number that is mandatory for invoices in Norway.

            '
          type: string
          maxLength: 255
        vendorInternalId:
          oneOf:
          - $ref: '#/components/schemas/InternalId'
          - type: 'null'
        vendorExternalId:
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        vendor:
          oneOf:
          - $ref: '#/components/schemas/SparseVendor'
          - type: 'null'
        lineItems:
          type: array
          minItems: 1
          uniqueItems: true
          description: The invoice's line items. When line item grouping is enabled for your company, line items that share the same general ledger account and dimensions are combined into a single summary line. Custom line field values can additionally be included in the grouping so that lines whose custom line field values differ remain separate; contact Vic.ai support to enable this.
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        postingError:
          type: string
        documentUrl:
          type: string
          format: url
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        uiStatus:
          description: 'The invoice''s processing status as shown in the Vic.ai interface,

            or `null` if it has not been computed yet.

            '
          oneOf:
          - $ref: '#/components/schemas/InvoiceUiStatus'
          - type: 'null'
        bolNumbers:
          type: array
          items:
            $ref: '#/components/schemas/BillOfLadingNumber'
        selfAssessedUseTaxAmount:
          oneOf:
          - $ref: '#/components/schemas/MonetaryValue'
          - type: 'null'
        selfAssessedUseTaxAccount:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        markedAs:
          oneOf:
          - $ref: '#/components/schemas/InvoiceMarkedAs'
          - type: 'null'
        billStatus:
          $ref: '#/components/schemas/InvoiceBillStatus'
        externalPaymentAmount:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MonetaryValue'
          description: External payment amount as reported by the ERP system.
        externalPaymentCurrencyId:
          description: ISO 4217 currency code for the external payment.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Currency'
        externalPaymentDate:
          oneOf:
          - type: string
            format: date
          - type: 'null'
        externalPaymentNumber:
          description: 'Used to identify external payments.

            '
          oneOf:
          - type: string
            maxLength: 32
          - type: 'null'
        externalPaymentStatus:
          example: paid
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InvoiceExternalPaymentStatus'
        externalPaymentType:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PaymentMethod'
        externalPaymentSource:
          description: The financial entity or bank account the payment was made from in the ERP system.
          oneOf:
          - type: 'null'
          - type: string
            maxLength: 255
        externalPaymentTotalPaid:
          description: Total amount actually paid in the ERP system.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MonetaryValue'
    SparseVendor:
      type: object
      description: A vendor object but sparsely populated.
      required:
      - internalId
      properties:
        internalId:
          $ref: '#/components/schemas/InternalId'
        externalId:
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        orgNumber:
          oneOf:
          - type: string
          - type: 'null'
        countryCode:
          oneOf:
          - $ref: '#/components/schemas/CountryCode'
          - type: 'null'
        name:
          oneOf:
          - type: string
          - type: 'null'
    PaginationMetaV2:
      type: object
      properties:
        cursor:
          description: 'The cursor to the next page of data. If it is null, that means there

            is no more data to fetch.

            '
          oneOf:
          - type: string
          - type: 'null'
    ExternalId:
      description: 'The external id set by the ERP system. It does not have to be a UUID and

        can be any non empty string desired.

        '
      type: string
      example: 21b31bc7-1267-4335-893c-d7fe4706a238
      maxLength: 255
    MatchItem:
      type: object
      required:
      - invoiceItemId
      - purchaseOrderItemId
      - quantityMatched
      properties:
        invoiceItemId:
          type: string
          description: The invoice item's internal id.
        purchaseOrderItemId:
          type: string
          description: The purchase order item's internal id.
        purchaseOrderItemLineNumber:
          type: string
          description: The purchase order item's line number.
        productNumber:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: The matched purchase order line product number (the human-readable item identifier, also shown as "Item ID" in the Vic.ai UI).
        unitOfMeasure:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: The matched purchase order line unit of measure.
        amountMatched:
          type: string
        quantityMatched:
          type: string
    InvoiceField:
      type: object
      properties:
        label:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 255
          enum:
          - text
          - select
          - date
          description: 'How the field''s value should be interpreted by clients.

            `text` accepts any printable string; `select` accepts one of the

            field''s configured options; `date` is stored as an ISO 8601

            `YYYY-MM-DD` calendar date.

            '
        value:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
    Email:
      type: string
      format: email
      maxLength: 255
    InvoiceInternalId:
      type: string
      description: The id of the `Invoice` in Vic.
      maxLength: 255
    InvoiceItemLineType:
      type: string
      description: The type of invoice item line.
      enum:
      - item
      - expense
      default: expense
    SubscriptionUpsert:
      type: object
      required:
      - callbackUrl
      - accessToken
      properties:
        callbackUrl:
          type: string
          format: uri
          example: https://my.erp.com/vic-callback/
        accessToken:
          type: string
          maxLength: 1024
        events:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/WebhookEventName'
          - type: 'null'
          description: 'The list of events to subscribe to. If you wish to subscribe to all

            events simply pass `["all"]`. If you are updating the subscription

            and wish to leave the events subscribed to alone, this field should

            be left unspecified or null.

            '
    VendorRemoteError:
      description: 'The remote error on a Vendor.

        This is to describe any errors that have happened in the ERP system. If

        the error that occurred does not pertain to a specific field, then the

        `field` can be left null, or missing all together.

        '
      type: object
      required:
      - message
      properties:
        message:
          type: string
          maxLength: 1024
        field:
          description: 'The field on the Vic.ai vendor that has the error.

            If the error does not pertain to a specific field, then this will be

            null.

            Example: `{"field": "name"}` or `{"field": "externalUpdatedAt"}`

            '
          type: string
          maxLength: 255
    InvoiceApprovedEvent:
      type: object
      required:
      - id
      - occurred_at
      - event
      - data
      properties:
        id:
          type: string
          description: The ID of the event. This is idempotent.
          format: uuid
        occurred_at:
          type: string
          description: The date and time the event occurred.
          format: date-time
        event:
          type: string
          enum:
          - invoice_approved
        data:
          $ref: '#/components/schemas/Invoice'
    MatchedPurchaseOrder:
      type: object
      required:
      - internalId
      - poNumber
      properties:
        internalId:
          description: The purchase order's internal id.
          type: string
          maxLength: 255
        externalId:
          description: The purchase order's external id.
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        poNumber:
          type: string
          description: The purchase order's po number.
    InvoicePaymentTerm:
      type: object
      required:
      - count
      - unit
      properties:
        count:
          type: integer
          minimum: 0
          description: The number of `unit` for the payment term.
        unit:
          $ref: '#/components/schemas/PaymentInfoTermUnit'
    Error:
      description: 'generic error message in JSON format.  Note the ''code'' field should

        match the HTTP status code of the wrapping HTTP request.

        '
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          minimum: 100
          maximum: 599
        message:
          $ref: '#/components/schemas/ErrorString'
    PurchaseOrderDeletedEvent:
      type: object
      required:
      - id
      - occurred_at
      - event
      - data
      properties:
        id:
          type: string
          description: The ID of the event. This is idempotent.
          format: uuid
        occurred_at:
          type: string
          description: The date and time the event occurred.
          format: date-time
        event:
          type: string
          enum:
          - purchase_order_deleted
        data:
          type: object
          required:
          - internalId
          properties:
            internalId:
              type: string
              example: dbbfd5b7-8741-42c7-8f3e-39eaafbaf287
            externalId:
              oneOf:
              - $ref: '#/components/schemas/ExternalId'
              - type: 'null'
    PaymentInfo:
      type: object
      properties:
        bankAccountNum:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        bankCode:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        paymentTerm:
          oneOf:
          - $ref: '#/components/schemas/PaymentInfoTerm'
          - type: 'null'
        bankGiro:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        plusGiro:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        bban:
          oneOf:
          - type: string
            maxLength: 255
          - type: 'null'
        internationalBankAccount:
          oneOf:
          - $ref: '#/components/schemas/InternationalBankAccount'
          - type: 'null'
        defaultMethod:
          $ref: '#/components/schemas/PaymentInfoMethod'
    InvoiceRef:
      type: object
      description: A reference to an `Invoice`.
      properties:
        internalId:
          oneOf:
          - $ref: '#/components/schemas/InvoiceInternalId'
          - type: 'null'
        externalId:
          oneOf:
          - $ref: '#/components/schemas/ExternalId'
          - type: 'null'
        refNumber:
          type:
          - string
          - 'null'
    PaymentInfoTerm:
      type: object
      required:
      - count
      - unit
      properties:
        count:
          type: integer
          minimum: 1
        unit:
          $ref: '#/components/schemas/PaymentInfoTermUnit'
    InvoiceUiStatus:
      type: string
      description: 'The invoice''s processing status as shown in the Vic.ai interface.

        '
      enum:
      - duplicate
      - export_failed
      - export_in_progress
      - exported
      - missing_fields
      - missing_item_fields
      - post_failed
      - post_in_progress
      - posted
      - posted_partial
      - predicted_total_error
      - reviewed
      - submit_failed
      - submit_in_progress
      - submitted
      - transfer_failed
      - transfer_in_progress
      - transferred
      - unreviewed
  responses:
    SubscriptionUpsertedResponse:
      description: Subscription successfully upserted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubscriptionUpsert'
    GetSubscriptionResponseV2:
      description: Subscription details
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/SubscriptionV2'
    ErrorResponse:
      description: An unexpected error has occurred. Check the body for more details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorResponseV2:
      description: An unexpected error has occurred. Check the body for more details.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorV2'
    UpdateSubscriptionResponseV2:
      description: Subscription updated successfully
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/SubscriptionV2'
    SubscriptionResponse:
      description: The subscription information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubscriptionUpsert'
    ListSubscriptionsResponseV2:
      description: A paginated list of webhook subscriptions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubscriptionsListV2'
    TooManyRequestsResponse:
      description: HTTP call rate limit exceeded.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request. Waiting this long guarantees the rate-limit window has reset.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ResourceNotFoundResponse:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SubscriptionDeletedResponse:
      description: Subscription successfully deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnsubscribeResult'
    CreateSubscriptionResponseV2:
      description: Subscription created successfully
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/SubscriptionV2'
  parameters:
    SubscriptionToken:
      in: header
      name: Authorization
      description: 'The token provided for the `Subscription`.

        The header will appear as follows `Bearer YOURTOKEN`.

        '
      example: Bearer abc123mysecrettoken456def
      required: false
      schema:
        type: string
    CompanyId:
      name: company_id
      in: path
      required: true
      description: The ID of the company
      schema:
        type: string
        format: uuid
    PaginationV2:
      name: page
      in: query
      schema:
        $ref: '#/components/schemas/PaginationV2'
    RequestId:
      in: header
      name: X-Request-Id
      description: token to be able to correctly log associated requests
      required: false
      schema:
        type: string
        format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
